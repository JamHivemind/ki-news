name: Seite bauen
on:
  push:
    paths: ['content.json', 'template.html', 'scripts/**', 'assets/**']
  schedule:
    # Feeds vor dem Morgenlauf der Routine holen (Routine 07:00 Berlin im Winter). GitHub startet geplante Läufe oft 1-2 Stunden später,
    # daher zwei Läufe mit viel Vorlauf (03:00 und 04:30 Berlin). Die Cloud-Umgebung der Routine erreicht die Nachrichtenseiten nicht, GitHub schon.
    - cron: '0 2 * * *'
    - cron: '30 3 * * *'
    # Kennzahlen auch an Tagen ohne neue Ausgabe nachziehen (09:15 Berlin im Winter)
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # immer den neuesten Stand bauen, nicht den Stand beim Auslösen (sonst Konflikte, wenn mehrere Läufe hintereinander warten)
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Feeds holen (für die Routine)
        run: node scripts/feeds.mjs

      - name: Kennzahlen holen (arXiv, Börse, Hugging Face)
        run: node scripts/metrics.mjs

      - name: Seite aus content.json bauen
        run: node scripts/build.mjs

      - name: Commit und Push
        run: |
          git config user.name "ki-news[bot]"
          git config user.email "ki-news[bot]@users.noreply.github.com"
          commit() { git add index.html archive/ seen.json data/ feeds.json; git diff --cached --quiet && return 1; git commit -q -m "seite: $(node -p 'require("./content.json").date')"; }
          commit || exit 0
          # GitHub lehnt Pushes gelegentlich ab (Fehler oder neuer Stand): bis zu 5 Versuche.
          # Gibt es beim Zusammenführen einen Konflikt in erzeugten Dateien, auf den neuesten Stand setzen und neu bauen.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            sleep $((i * 15))
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort
              git reset -q --hard origin/main
              node scripts/build.mjs
              commit || exit 0
            fi
          done
          exit 1
