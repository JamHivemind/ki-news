name: Seite bauen
on:
  push:
    paths: ['content.json', 'template.html', 'scripts/**', 'assets/**']
  schedule:
    # Feeds vor dem Morgenlauf der Routine holen (05:00 Berlin im Winter; Routine 07:00). GitHub startet geplante Läufe oft bis zu 1 Stunde später, daher viel Vorlauf.
    # Die Cloud-Umgebung der Routine erreicht die Nachrichtenseiten nicht, GitHub schon.
    - cron: '0 4 * * *'
    # Kennzahlen auch an Tagen ohne neue Ausgabe nachziehen (09:15 Berlin im Winter)
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Feeds holen (für die Routine)
        run: node scripts/feeds.mjs

      - name: Kennzahlen holen (arXiv, Börse, Hugging Face)
        run: node scripts/metrics.mjs

      - name: Seite aus content.json bauen
        run: node scripts/build.mjs

      - name: Commit und Push
        run: |
          git config user.name "ki-news[bot]"
          git config user.email "ki-news[bot]@users.noreply.github.com"
          git add index.html archive/ seen.json data/ feeds.json
          git diff --cached --quiet && exit 0
          git commit -m "seite: $(node -p 'require("./content.json").date')"
          # GitHub lehnt Pushes gelegentlich mit "Internal Server Error" ab: bis zu 4 Versuche
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
