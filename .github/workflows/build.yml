name: Seite bauen
on:
  push:
    paths: ['content.json', 'template.html', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Seite aus content.json bauen
        run: node scripts/build.mjs

      - name: Commit und Push
        run: |
          git config user.name "ki-news[bot]"
          git config user.email "ki-news[bot]@users.noreply.github.com"
          git add index.html archive/ seen.json
          git diff --cached --quiet || (git commit -m "seite: $(node -p 'require("./content.json").date')" && git push)
