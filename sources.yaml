site:
  title: "KI-News"
  description: "Die wichtigsten Neuigkeiten aus der KI-Welt, jeden Morgen kurz auf Deutsch"
  lang: de
  timezone: Europe/Berlin

# Feste Reihenfolge der Rubriken auf der Seite
categories:
  - Modelle & Releases
  - Claude & Anthropic
  - Tools & Agenten
  - KI im Alltag & Beruf
  - Business & Funding
  - Regulierung & Politik
  - Forschung & Deep Tech

# Alle Quellen am 2026-11-04 geprüft (erreichbar, aktuell).
sources:
  # --- Hersteller: Original-Ankündigungen, als Link bevorzugen ---
  # Anthropic hat keinen RSS-Feed: Google News nach Anthropic/Claude (via = Originalseite)
  - name: Anthropic (Google News)
    url: https://news.google.com/rss/search?q=Anthropic+OR+%22Claude+Code%22+when:2d&hl=en-US&gl=US&ceid=US:en
    type: rss
    focus: "Neue Claude-Modelle, Funktionen, Claude Code, Produkt-Updates. Bevorzugt Einträge von anthropic.com"
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    type: rss
  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    type: rss
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    type: rss
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    type: rss
    focus: "Nur wichtige offene Modelle und Werkzeuge, keine Tutorials"

  # --- Nachrichten, englisch ---
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    type: rss
    focus: "Finanzierungen, Übernahmen, Produktstarts"
  - name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    type: rss
    focus: "KI in Alltagsprodukten (Handy, Suche, Assistenten)"
  - name: MIT Technology Review
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    type: rss
    focus: "Einordnung, Gesellschaft, Forschung"

  # --- Nachrichten, deutsch ---
  - name: heise online
    url: https://www.heise.de/rss/heise-Rubrik-IT-atom.xml
    type: rss
    focus: "Nur Meldungen mit KI-Bezug. Datenschutz, EU, deutsche Unternehmen"
  - name: t3n
    url: https://t3n.de/tag/kuenstliche-intelligenz/rss.xml
    type: rss
    focus: "KI im Beruf, Tools für den Arbeitsalltag"
  - name: The Decoder
    url: https://the-decoder.de/feed/
    type: rss

  # --- Digests und Kommentare ---
  - name: AINews (Latent Space)
    url: https://www.latent.space/feed
    type: rss
    focus: "Nur die neueste AINews-Ausgabe. Daraus die echten Neuigkeiten ziehen, als Link die verlinkte Original-Ankündigung nehmen."
  - name: Ben's Bites
    url: https://www.bensbites.com/feed
    type: rss
    focus: "Praxisnahe Tools und Anwendungen"
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    type: rss
    focus: "Nur wenn es ein neues Modell oder Werkzeug konkret einordnet"

  # --- Newsletter per Mail (Gmail-Connector der Routine) ---
  - name: Impossible Founders
    type: gmail
    query: "from:impossible-founders.com newer_than:3d"
    focus: "Deep-Tech-Briefing aus Hamburg (alle zwei Wochen). Nur Inhalte mit KI- oder Deep-Tech-Bezug, Rubrik Forschung & Deep Tech. Link nur auf öffentliche Seiten, nie auf Links aus der Mail."
